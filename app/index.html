<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport settings for responsiveness -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json">
    <!-- maximum-scale=1 + user-scalable=no removed: on Android Chrome (esp. on
         tablets) those two together change touch-event delivery so single-
         finger drag gets eaten by the gesture handler instead of scrolling.
         iOS Safari ignored them so this never showed up there. We accept the
         minor regression that pinch-zoom is now possible on the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Apple PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Favicon for various devices (all PNG; the .svg slot was removed when we
         swapped to a raster icon). -->
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%free-sleep-icon_96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%free-sleep-icon_192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%free-sleep-icon_512.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="%BASE_URL%free-sleep-icon_120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="%BASE_URL%free-sleep-icon_144.png">
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%free-sleep-icon_180.png">

    <!-- Windows Tile Icons -->
    <meta name="msapplication-TileImage" content="%BASE_URL%free-sleep-icon_144.png">
    <meta name="msapplication-TileColor" content="#000000">

    <!-- Theme color for mobile address bar -->
    <meta name="theme-color" content="#000000">

    <title>Nightstand</title>

    <style>
      html, body { background: #000; color-scheme: dark; }
      #boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        min-height: 60vh; color: rgba(255, 255, 255, 0.7); font: 14px system-ui, sans-serif; }
      @media (prefers-reduced-motion: no-preference) {
        #boot::before { content: ""; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%;
          border: 3px solid #88878C; border-top-color: #fff; animation: boot-spin 1s linear infinite; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
      }
    </style>

  </head>
  <body>
    <div id="root"><div id="boot" role="status">Loading Nightstand</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
